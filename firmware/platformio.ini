; Firmware ESP32 doc UPS Vertiv GXT-3000MTPLUS230 qua RS-232 (MAX3232)
; roi day len Home Assistant bang MQTT Discovery.
;
; Giu DUNG topic + payload nhu agent Windows (Ups-Monitor.ps1), nen panel,
; nhat ky va engine canh bao ben HA khong phai sua gi.

[platformio]
default_envs = esp32c3

[common]
framework      = arduino
platform       = espressif32
monitor_speed  = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048     ; payload discovery + nhat ky kha dai
    -D CORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
;  ESP32-C3 Super Mini  (mac dinh)
;  - Chi co UART0 va UART1 -> firmware dung UART1
;  - Nap chuong trinh + Serial monitor qua USB CDC goc, khong qua chip CH340
;    nen phai bat ARDUINO_USB_CDC_ON_BOOT thi Serial moi ra USB
; ---------------------------------------------------------------------------
[env:esp32c3]
extends       = common
board         = esp32-c3-devkitm-1
build_flags   =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D UPS_UART_NUM=1
    -D UPS_RX_PIN=4
    -D UPS_TX_PIN=5

; ---------------------------------------------------------------------------
;  ESP32 co dien (WROOM-32). Giu lai de doi board khong phai sua code.
; ---------------------------------------------------------------------------
[env:esp32dev]
extends       = common
board         = esp32dev
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -D UPS_UART_NUM=2
    -D UPS_RX_PIN=16
    -D UPS_TX_PIN=17
