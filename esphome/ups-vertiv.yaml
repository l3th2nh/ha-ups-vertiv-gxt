# Firmware doc UPS Vertiv/Liebert GXT-3000MTPLUS230 qua RS-232.
# ESP32-C3 Super Mini + module SP3232 (V0018). Nap lan dau qua USB; sau do OTA.
#
# DAU NOI phia TTL
#   SP3232 VCC -> ESP32-C3 3V3   (KHONG cam 5V)
#   SP3232 GND -> ESP32-C3 GND
#   SP3232 TXD -> ESP32-C3 GPIO4   (du lieu tu UPS ve)
#   SP3232 RXD -> ESP32-C3 GPIO5   (lenh gui sang UPS)
#
# DAU NOI phia RS-232 - DA KIEM CHUNG THUC TE, chi BA day roi:
#   UPS chan 2 (PHAT cua UPS) -> pad '2-RXD' cua module  <- dau vao bo THU
#   UPS chan 3 (THU cua UPS)  -> pad '3-TXD' cua module  <- dau ra bo PHAT
#   UPS chan 5 (GND)          -> pad '5-GND'
#   Tuc la NOI THANG theo so: 2->2, 3->3, 5->5. KHONG dau cheo.
#   Cong RS-232 cua UPS dau kieu DCE, giong ho Megatec/PowerMust.
#   4 pad giua board (TTL-CTS/RTS, 232-CTS/RTS): DE TRONG.
#
#   CANH BAO: chan 3 do duoc -9V nhung do KHONG phai chan du lieu. Da mat gan
#   hai ngay vi suy dien tu phep do dien ap do. Muc am chi chung minh day la
#   MOT dau ra dang giu MARK, khong chung minh no la duong du lieu.
#   Bang chung that la UPS tra loi: QPI -> (PI01, QMOD -> (L,
#   QGS -> (242.8 50.0 229.5 50.0 001.5 011 374.0 375.9 082...
#
#   Chan 4/5 chon co chu y: tranh GPIO2/8/9 vi la chan strapping tren C3
#   (GPIO8 con la LED onboard, GPIO9 la nut BOOT).
#
# LUU Y: cong USB va cong RS-232 cua UPS KHONG dung duoc cung luc.
#        Phai rut cap USB khoi UPS thi RS-232 moi noi.

esphome:
  name: ups-vertiv
  friendly_name: UPS Vertiv

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  # USB_SERIAL_JTAG: log di thang qua cong USB native cua ESP32-C3, KHONG chiem
  # GPIO nao. Tuyet doi khong dung baud_rate: 0 - cai do tat log HOAN TOAN,
  # ke ca qua USB, va da tung lam mat ca buoi chan doan.
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # QUAN TRONG: khong cho WiFi ngu -> so lieu khong tre/rot
  fast_connect: true      # ket noi lai nhanh khi mat song
  ap:
    ssid: "UPS-Vertiv Fallback"
    password: "upsvertiv123"

captive_portal:

# Component doc UPS nam ngay trong repo nay
external_components:
  - source:
      type: local
      path: components
    components: [ups_voltronic]

# ---------------------------------------------------------------------------
#  UART toi module MAX3232
#
#  baud_rate: manual KHONG ghi toc do. 2400 la chuan Megatec/Voltronic pho bien
#  nhat. Neu log bao "Khong co phan hoi cho 'QMOD'..." thi thu lan luot
#  9600 -> 1200 -> 4800 -> 19200, moi lan chi can OTA lai, khong phai cam day.
# ---------------------------------------------------------------------------
uart:
  id: ups_uart
  # SP3232 TXD -> GPIO4, RXD -> GPIO5. Neu khong nhan duoc du lieu, dao hai
  # chan nay roi nap lai - vo hai, khong chay gi.
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 2400        # diem xuat phat; firmware tu quet neu khong co phan hoi
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Ten entity de TIENG ANH cho slug sach va doan truoc duoc.
# Phan chu tieng Viet nam o panel (ups-panel-card.js) - cung nguyen tac
# da ap dung cho agent Windows truoc day.
ups_voltronic:
  id: ups
  uart_id: ups_uart
  # 5s: mot vong 5 lenh chi mat ~1.5s khi UPS tra loi binh thuong (~250ms/lenh),
  # nen 5s la an toan va cat tre phat hien mat dien tu ~16s xuong ~6s.
  update_interval: 5s
  rated_watts: 2400        # 3000 VA x PF 0.80, lay tu lenh QMD cua chinh may nay

  battery_level:
    name: "Battery"
  runtime:
    name: "Runtime"
  load:
    name: "Load"
  load_power:
    name: "Load Power"
  input_voltage:
    name: "Input Voltage"
  output_voltage:
    name: "Output Voltage"
  battery_voltage:
    name: "Battery Voltage"
  input_frequency:
    name: "Input Frequency"
  output_frequency:
    name: "Output Frequency"
  output_current:
    name: "Output Current"
  temperature:
    name: "Temperature"

  status:
    name: "Status"
  on_battery:
    name: "On Battery"
  fault:
    name: "Fault"
  outlet_p1:
    name: "Outlet P1"

# Cam bien chan doan de theo doi chinh thiet bi tu xa
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
